name: docker-runtime-image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - default-danser.json
      - docker/entrypoint.sh
      - src/**
      - migrations/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/docker-runtime-image.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - default-danser.json
      - docker/entrypoint.sh
      - src/**
      - migrations/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/docker-runtime-image.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mikumin27/oscbot

jobs:
  build-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: Swatinem/rust-cache@v2
        with:
          # PR and dependabot builds read main's cache but don't evict it with their own
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked --bin oscbot
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
      - uses: actions/upload-artifact@v7
        with:
          name: oscbot-binary
          path: target/release/oscbot
          if-no-files-found: error
          retention-days: 1

  docker:
    needs: build-binary
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Dockerfile
            default-danser.json
            docker/entrypoint.sh
            src/generate/data
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: oscbot-binary

      - uses: docker/setup-buildx-action@v4

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = main ]; then t=latest; else t=$(echo "$REF_NAME" | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9_.-]+/-/g'); fi
          echo "tags=$IMAGE:$t,$IMAGE:${t/latest/sha}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # PRs build the image to prove it builds, main pushes it
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
